<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">

        <a class="navbar-brand" href="{{ url_for('dashboard') }}">
            Farmer Empowerment
        </a>

        <div>
            <a href="{{ url_for('dashboard') }}"
               class="btn btn-light me-2">
                Dashboard
            </a>

            <a href="{{ url_for('logout') }}"
               class="btn btn-danger">
                Logout
            </a>
        </div>

    </div>
</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow p-4">

                <h2 class="text-center text-success mb-4">
                    Farmer Profile
                </h2>

                <div class="mb-3">
                    <label class="form-label">
                        <strong>Farmer ID</strong>
                    </label>

                    <input type="text"
                           class="form-control"
                           value="{{ farmer.id }}"
                           readonly>
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        <strong>Name</strong>
                    </label>

                    <input type="text"
                           class="form-control"
                           value="{{ farmer.name }}"
                           readonly>
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        <strong>Email</strong>
                    </label>

                    <input type="email"
                           class="form-control"
                           value="{{ farmer.email }}"
                           readonly>
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        <strong>Phone</strong>
                    </label>

                    <input type="text"
                           class="form-control"
                           value="{{ farmer.phone }}"
                           readonly>
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        <strong>Location</strong>
                    </label>

                    <input type="text"
                           class="form-control"
                           value="{{ farmer.location }}"
                           readonly>
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        <strong>Registered On</strong>
                    </label>

                    <input type="text"
                           class="form-control"
                           value="{{ farmer.created_at }}"
                           readonly>
                </div>


                <div class="text-center mt-4">

                    <a href="{{ url_for('dashboard') }}"
                       class="btn btn-success">
                        Back to Dashboard
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
